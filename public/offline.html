<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07070b" />
  <title>You’re offline | Obinna Justice</title>
  <!-- Shown by the service worker when a page isn't cached and there's no connection. -->
  <script>
    (function () { var t; try { t = localStorage.getItem("theme"); } catch (e) {} if (t !== "light" && t !== "dark") { t = "dark"; } document.documentElement.dataset.theme = t; })();
  </script>
  <style>
    :root { color-scheme: dark; --ink: #07070b; --fg: #ededf2; --muted: #a1a1b5; }
    [data-theme="light"] { color-scheme: light; --ink: #f6f7f9; --fg: #0b0d12; --muted: #565c6e; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1rem; background: var(--ink); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    .badge { width: 56px; height: 56px; margin: 0 auto 1.5rem; border-radius: 14px; display: grid; place-items: center; background: #0f0f17; border: 2px solid #3b82f6; box-sizing: border-box; color: #3b82f6; font-weight: 800; }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0.75rem 0 0; font-size: 2.25rem; }
    p.lead { max-width: 24rem; margin: 1rem auto 0; color: var(--muted); line-height: 1.6; }
    a { display: inline-flex; align-items: center; height: 48px; margin-top: 2rem; padding: 0 1.75rem; border-radius: 999px; background: #2563eb; color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="badge">OJ</div>
    <p class="eyebrow">No connection</p>
    <h1>You’re offline</h1>
    <p class="lead">This page hasn’t been saved for offline use yet. Pages you’ve already visited still work.</p>
    <a href="/">Go to home page</a>
  </main>
</body>
</html>
